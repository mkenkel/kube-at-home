# SOPS creation rules. Secrets are encrypted with age; Flux decrypts them in-cluster.
# The private key is kept in the password manager and must never be committed.
creation_rules:
  - path_regex: (clusters|infrastructure|apps)/.*\.sops\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    # Public recipient only. The private key is in the password manager.
    age: age1cf0ee6n2c55zyzhgdngzrw3xu86mu9mdae28mdha4kzr9x2h8g2qnwputp
