#_preseed_V1
# Debian unattended minimal install for node-1..4 (Lenovo M70q Gen2, one NVMe).
# Served over HTTP and passed via url= from a netboot.xyz custom menu entry.
# See README.md. Contains no secrets: the user has a locked password and logs in by SSH key only.

### Locale, keyboard, clock
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Network: DHCP, hostname comes from the OPNsense static mapping
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean false
# Placeholders only. netcfg prefers the name handed out by DHCP and only uses
# these when the lease carries no hostname/domain, so the prompts never block.
# Do NOT replace them with real node names.
d-i netcfg/get_hostname string unassigned-hostname
d-i netcfg/get_domain string unassigned-domain
d-i netcfg/hostname string unassigned-hostname
d-i netcfg/dhcp_timeout string 60
d-i netcfg/dhcp_failure select abort
d-i netcfg/wireless_wep string

### Mirror
d-i mirror/country string manual
d-i mirror/protocol string http
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Accounts: no root login, one sudo user, SSH key only
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Ops
d-i passwd/username string ops
# "!" is a locked password hash: password login is impossible, SSH key only.
d-i passwd/user-password-crypted password !
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false

### Disk: one NVMe, plain GPT partitions, no LVM, no swap
# etcd wants low-latency fsync, so keep the OS and /var/lib/etcd on the NVMe
# root filesystem directly. Kubernetes also wants swap off, so there is none.
# The second bay (Longhorn data) is left untouched.
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select kube-node
d-i partman-auto/expert_recipe string \
    kube-node :: \
        512 512 512 free \
            $iflabel{ gpt } \
            $reusemethod{ } \
            method{ efi } \
            format{ } \
        . \
        20000 50000 -1 ext4 \
            method{ format } \
            format{ } \
            use_filesystem{ } \
            filesystem{ ext4 } \
            mountpoint{ / } \
            options/noatime{ noatime } \
        .
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

### Packages: minimal, Ansible does the rest
tasksel tasksel/first multiselect
d-i pkgsel/include string openssh-server python3 python3-debian sudo
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/cdrom/set-first boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/nvme0n1

### SSH key and sudo for Ansible
# TODO: replace the placeholder below with your real PUBLIC key (one line).
# The install deliberately fails while "TODO" is still present, so a node
# can never come up with no way in.
d-i preseed/late_command string \
    KEY='ssh-ed25519 AAAAPLACEHOLDER TODO-replace-with-your-public-key'; \
    case "$KEY" in *TODO*) echo "preseed: SSH key placeholder not replaced" >&2; exit 1;; esac; \
    mkdir -p /target/home/ops/.ssh; \
    echo "$KEY" > /target/home/ops/.ssh/authorized_keys; \
    in-target chown -R ops:ops /home/ops/.ssh; \
    in-target chmod 700 /home/ops/.ssh; \
    in-target chmod 600 /home/ops/.ssh/authorized_keys; \
    echo 'ops ALL=(ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/ops; \
    in-target chmod 440 /etc/sudoers.d/ops; \
    echo 'PasswordAuthentication no' > /target/etc/ssh/sshd_config.d/10-keys-only.conf

### Finish
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false
