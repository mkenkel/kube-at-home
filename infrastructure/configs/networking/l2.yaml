# LoadBalancer IPs from 192.168.15.100-200, announced over ARP. The range sits outside the
# OPNsense DHCP pool (.201-.254) and clear of static mappings (see knowledge/decisions/cluster-topology.md).
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: home
spec:
  blocks:
    - start: 192.168.15.100
      stop: 192.168.15.200
---
# All services, all nodes (control planes are untainted and run workloads), all interfaces.
# Narrow `interfaces` (e.g. ^eno1$) if announcements start going out on the wrong NIC.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: home
spec:
  loadBalancerIPs: true
  externalIPs: true
