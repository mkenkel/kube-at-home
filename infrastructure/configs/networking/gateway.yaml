# Shared ingress Gateway. The GatewayClass `cilium` is created by the Cilium chart.
# Fixed IP so DNS records stay stable.
# HTTPS listeners (wildcard cert from cert-manager) are added once the domain and issuer exist.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: home
  namespace: gateway
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.15.100
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
