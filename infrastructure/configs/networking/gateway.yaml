# Shared ingress Gateway. The GatewayClass `cilium` is created by the Cilium chart.
# Fixed IP so DNS records stay stable.
# The HTTPS listener uses the wildcard cert from cert-manager (certificate.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: home
  namespace: gateway
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.15.100
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: "*.home.mkenkel.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: home-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
