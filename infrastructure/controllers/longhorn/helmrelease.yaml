# Longhorn stores replicas under /var/lib/longhorn on the root filesystem: each node has a single
# 1TB NVMe that also holds the OS and etcd (see knowledge/decisions/storage.md). The limits below
# keep volumes from filling that disk. The UI has no authentication, so it is not exposed.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart's manager network policy only admits Longhorn's own pods, so Prometheus could never
    # scrape port 9500. Allow Prometheus only: that port also serves the Longhorn REST API.
    networkPolicies:
      metricsScrapeSources:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 3
    defaultSettings:
      defaultReplicaCount: 3
      # Percent of each disk kept free for the OS and etcd, and the free-space floor for new replicas.
      storageReservedPercentageForDefaultDisk: 30
      storageMinimalAvailablePercentage: 25
      storageOverProvisioningPercentage: 100
