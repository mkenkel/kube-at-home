# Single-process Loki on a Longhorn volume, filesystem storage, no auth (single tenant, cluster
# internal only). Caches, gateway and canary are off to keep the footprint small.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: loki
      version: 20.2.1
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deploymentMode: Monolithic
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 30Gi
        storageClass: longhorn
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 336h
      compactor:
        working_directory: /var/loki/retention
        delete_request_store: filesystem
        retention_enabled: true
    # Only the single-binary StatefulSet runs; the chart refuses to render with the
    # simple-scalable targets also non-zero.
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    gateway:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
