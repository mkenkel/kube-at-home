# Prometheus, Alertmanager, Grafana, node-exporter and kube-state-metrics.
# Data lives on Longhorn. Prometheus and Alertmanager UIs are not exposed (no authentication);
# use `kubectl port-forward`. Grafana is at https://grafana.home.mkenkel.com via the Gateway
# (infrastructure/configs/monitoring/httproute.yaml). Admin login: Secret grafana-admin (SOPS).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.17.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # No kube-proxy: Cilium replaces it. etcd, scheduler and controller-manager are scraped over the
    # node IPs; ansible/control-plane-metrics.yml makes them listen on 0.0.0.0 (kubeadm default is 127.0.0.1).
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 25GB
        # Pick up ServiceMonitors/PodMonitors from any namespace (Longhorn, Cilium, apps), not
        # only those labelled for this release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 30Gi
    # Flux resource state for alerts (from fluxcd/flux2-monitoring-example). Unlike that example the
    # standard collectors stay on: many default alerts (crash-looping pods, unavailable deployments)
    # need them.
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - helmrepositories
              - kustomizations
              - helmreleases
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
                      chart_source_name: [spec, chart, spec, sourceRef, name]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux GitRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
    alertmanager:
      alertmanagerSpec:
        # Mounted at /etc/alertmanager/secrets/alertmanager-ntfy/token (SOPS secret).
        secrets:
          - alertmanager-ntfy
      config:
        route:
          receiver: ntfy
          group_by:
            - namespace
            - alertname
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            # The always-firing heartbeat and the helper that quiets info alerts are not for humans.
            - receiver: "null"
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
        receivers:
          - name: "null"
          - name: ntfy
            webhook_configs:
              # ntfy's built-in `alertmanager` template formats firing and resolved alerts.
              - url: http://ntfy.ntfy.svc.cluster.local/alerts?template=alertmanager
                send_resolved: true
                http_config:
                  authorization:
                    type: Bearer
                    credentials_file: /etc/alertmanager/secrets/alertmanager-ntfy/token
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
        # Include this volume in the Longhorn config backups.
        extraPvcLabels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/config: enabled
      grafana.ini:
        server:
          root_url: https://grafana.home.mkenkel.com
      additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
