# Prometheus, Alertmanager, Grafana, node-exporter and kube-state-metrics.
# Data lives on Longhorn. Prometheus and Alertmanager UIs are not exposed (no authentication);
# use `kubectl port-forward`. Grafana is at https://grafana.home.mkenkel.com via the Gateway
# (infrastructure/configs/monitoring/httproute.yaml). Admin login: Secret grafana-admin (SOPS).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.17.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # No kube-proxy: Cilium replaces it. etcd, scheduler and controller-manager are scraped over the
    # node IPs; ansible/control-plane-metrics.yml makes them listen on 0.0.0.0 (kubeadm default is 127.0.0.1).
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: 25GB
        # Pick up ServiceMonitors/PodMonitors from any namespace (Longhorn, Cilium, apps), not
        # only those labelled for this release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 30Gi
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi
      grafana.ini:
        server:
          root_url: https://grafana.home.mkenkel.com
