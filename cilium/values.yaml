# Cilium Helm values. Installed by hand in Phase 1 (after the Gateway API CRDs,
# before Flux); not reconciled by Flux.
#
# Chart version: 1.20.4 (checked 2026-11-01)
# Gateway API CRD version: v1.6.3 (what the Cilium docs list as supported; v1.7.0 is newer, do not use it)
#
#   helm repo add cilium https://helm.cilium.io
#   helm install cilium cilium/cilium --version 1.20.4 -n kube-system -f cilium/values.yaml
#
# Keep this file and `spec.values` in infrastructure/controllers/cilium/helmrelease.yaml identical,
# otherwise Flux changes the release when it adopts it.

# kube-proxy is skipped at kubeadm init (--skip-phases=addon/kube-proxy)
kubeProxyReplacement: true

# kube-vip VIP for the API server (node-1..3 control planes)
k8sServiceHost: 192.168.15.6
k8sServicePort: 6443

# LoadBalancer IPs announced over ARP (pool 192.168.15.100-200 is a
# CiliumLoadBalancerIPPool + CiliumL2AnnouncementPolicy, applied via Flux)
l2announcements:
  enabled: true
externalIPs:
  enabled: true
# L2 announcements use leases; raise the client rate limit so they don't throttle
k8sClientRateLimit:
  qps: 10
  burst: 20

# Pod CIDR must match networking.podSubnet in kubeadm/kubeadm-config.yaml
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.244.0.0/16

gatewayAPI:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
