extends: default

ignore: |
  .git/
  .workmux/

rules:
  line-length: disable
  document-start: disable
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  truthy:
    # GitHub Actions uses a bare `on:` key.
    check-keys: false
  braces:
    max-spaces-inside: 1
