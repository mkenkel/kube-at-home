---
# Kubernetes minor line; selects the pkgs.k8s.io repository.
kube_minor_version: "1.36"
# Exact deb version for kubeadm, kubelet and kubectl. Pinned and held.
# List available versions with: apt-cache madison kubeadm
# Checked against pkgs.k8s.io on 2026-11-01. Latest minor then was 1.37.
kube_pkg_version: "1.36.6-1.1"
# Set to true (-e kube_upgrade=true) to unhold before moving to a new kube_pkg_version.
kube_upgrade: false

# Phase 1 (cluster.yml). Checked 2026-11-01.
kube_vip_version: v1.3.1
kube_vip_interface: eno1
kube_api_vip: 192.168.15.6
# Helm 3 on purpose: Helm 4 applies server-side by default, which may clash when Flux adopts the release.
helm_version: v3.22.1
cilium_chart_version: 1.20.4
# Must match the version Cilium supports and clusters/home/gateway-api-crds.yaml.
gateway_api_version: v1.6.3
