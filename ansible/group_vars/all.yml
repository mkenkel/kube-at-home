---
# Kubernetes minor line; selects the pkgs.k8s.io repository.
kube_minor_version: "1.36"
# Exact deb version for kubeadm, kubelet and kubectl. Pinned and held.
# List available versions with: apt-cache madison kubeadm
# Checked against pkgs.k8s.io on 2026-11-01. Latest minor then was 1.37.
kube_pkg_version: "1.36.6-1.1"
# Set to true (-e kube_upgrade=true) to unhold before moving to a new kube_pkg_version.
kube_upgrade: false
