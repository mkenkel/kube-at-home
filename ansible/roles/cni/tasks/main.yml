---
# Runs on the first control plane. Order matters: Gateway API CRDs, then Cilium.
- name: Download Helm
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    checksum: "sha256:https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz.sha256sum"
    dest: "/root/helm-{{ helm_version }}.tar.gz"
    mode: "0644"

- name: Install Helm
  ansible.builtin.unarchive:
    src: "/root/helm-{{ helm_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1, linux-amd64/helm]
    creates: /usr/local/bin/helm

- name: Apply the Gateway API CRDs
  ansible.builtin.command: >-
    kubectl apply --server-side
    -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  # kubectl prints the same line whether or not anything changed, so this never reports a change.
  changed_when: false

- name: Copy the Cilium values
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../cilium/values.yaml"
    dest: /root/cilium-values.yaml
    owner: root
    group: root
    mode: "0600"

- name: Add the Cilium Helm repository
  ansible.builtin.command: helm repo add cilium https://helm.cilium.io
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

- name: Install Cilium
  ansible.builtin.command: >-
    helm upgrade --install cilium cilium/cilium --version {{ cilium_chart_version }}
    --namespace kube-system --values /root/cilium-values.yaml --wait --timeout 10m
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cni_cilium
  changed_when: "'has been upgraded' in cni_cilium.stdout or 'has been installed' in cni_cilium.stdout"

- name: Wait for all nodes to be Ready
  ansible.builtin.command: kubectl wait --for=condition=Ready nodes --all --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
