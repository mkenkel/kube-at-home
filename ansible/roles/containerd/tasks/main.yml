---
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Check for an existing containerd config
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: containerd_config

- name: Check whether the config already sets the cgroup driver
  ansible.builtin.command: grep -q SystemdCgroup /etc/containerd/config.toml
  register: containerd_config_check
  changed_when: false
  failed_when: false
  when: containerd_config.stat.exists

- name: Generate default containerd config
  ansible.builtin.shell: |
    set -o pipefail
    mkdir -p /etc/containerd
    containerd config default > /etc/containerd/config.toml
  args:
    executable: /bin/bash
  when: not containerd_config.stat.exists or containerd_config_check.rc != 0
  changed_when: true

- name: Use the systemd cgroup driver
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)SystemdCgroup\s*=\s*false\s*$'
    replace: '\1SystemdCgroup = true'
  notify: Restart containerd

# Cilium (and most CNIs) install their plugin binaries to /opt/cni/bin, but containerd's
# default config looks in /usr/lib/cni, so pods fail with "failed to find plugin cilium-cni".
- name: Look for CNI plugins in /opt/cni/bin
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*bin_dir\s*=\s*)"/usr/lib/cni"\s*$'
    replace: '\1"/opt/cni/bin"'
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
