---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# TLS and apt Release checks fail on a node whose clock is behind (seen on a fresh install).
- name: Enable chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

- name: Step the clock
  ansible.builtin.command: chronyc -a makestep
  changed_when: false

- name: Wait for the clock to sync
  ansible.builtin.command: chronyc waitsync 30 0.5
  changed_when: false

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true

- name: Remove swap entries from fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n]\S*\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

- name: Load kernel modules now and on boot
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: "{{ common_kernel_modules }}"

- name: Set sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ common_sysctls | dict2items }}"
