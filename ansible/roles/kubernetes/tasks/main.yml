---
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the Kubernetes repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kube_minor_version }}/deb/Release.key"
    dest: "/etc/apt/keyrings/kubernetes-{{ kube_minor_version }}.asc"
    owner: root
    group: root
    mode: "0644"

- name: Add the Kubernetes apt repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ kube_minor_version }}/deb/"
    suites: /
    signed_by: "/etc/apt/keyrings/kubernetes-{{ kube_minor_version }}.asc"
    state: present
  register: kubernetes_repo

- name: Unhold Kubernetes packages for an upgrade
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop: "{{ kubernetes_packages }}"
  when: kube_upgrade | bool

- name: Install pinned Kubernetes packages
  ansible.builtin.apt:
    name: "{{ kubernetes_packages | map('regex_replace', '$', '=' ~ kube_pkg_version) | list }}"
    state: present
    update_cache: "{{ kubernetes_repo is changed }}"
    allow_downgrade: "{{ kube_upgrade | bool }}"

- name: Hold Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_packages }}"

# kubeadm init/join will configure and start it; enabling is enough here.
- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
