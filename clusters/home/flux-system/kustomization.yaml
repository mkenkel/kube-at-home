apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# gotk-components.yaml only warns on `restricted`; enforce it too. Kept here,
# not in the generated file, so `flux bootstrap` does not overwrite it.
patches:
- target:
    kind: Namespace
    name: flux-system
  patch: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: flux-system
      labels:
        pod-security.kubernetes.io/enforce: restricted
