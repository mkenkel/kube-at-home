# Glance's configuration. A plain ConfigMap (not Helm values) because app-template would run
# Helm's templating over curly braces. A change reaches the pod after about a minute, then
# Glance reloads by itself (it logs "Config file changed, reloading"); if a page still looks
# stale after that, restart the pod: kubectl -n glance rollout restart deploy/glance
# The links use the Gateway names you use in a browser. The checks (`check-url`) go straight to
# each Service instead: a pod that calls a Gateway name gets "Access denied" from Envoy, because
# its own egress policy is applied to the backend the Gateway forwards to. So a green dot means
# the service itself answers its health URL, not that the Gateway route works. The matching
# ports are opened in glance-networkpolicy.yaml, media-isolation, ntfy-isolation and gitea-isolation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: glance
data:
  glance.yml: |
    server:
      port: 8080
      proxied: true
    branding:
      hide-footer: true
    pages:
      - name: Home
        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 12h
                timezones:
                  - timezone: UTC
                    label: UTC
              - type: bookmarks
                title: Links
                groups:
                  - title: Project
                    links:
                      - title: kube-at-home on GitHub
                        url: https://github.com/mkenkel/kube-at-home
                      - title: Cloudflare dashboard
                        url: https://dash.cloudflare.com
          - size: full
            widgets:
              - type: monitor
                title: Media
                cache: 1m
                sites:
                  - title: Seerr
                    url: https://overseerr.home.mkenkel.com
                    check-url: http://overseerr.media.svc.cluster.local:5055/api/v1/status
                  - title: Sonarr
                    url: https://sonarr.home.mkenkel.com
                    check-url: http://sonarr.media.svc.cluster.local:8989/ping
                  - title: Radarr
                    url: https://radarr.home.mkenkel.com
                    check-url: http://radarr.media.svc.cluster.local:7878/ping
                  - title: Prowlarr
                    url: https://prowlarr.home.mkenkel.com
                    check-url: http://prowlarr.media.svc.cluster.local:9696/ping
                  - title: Sabnzbd
                    url: https://sabnzbd.home.mkenkel.com
                    check-url: http://sabnzbd.media.svc.cluster.local:8080/api?mode=version&output=json
                  - title: Plex
                    url: http://192.168.15.27:32400/web
                    alt-status-codes: [301, 302, 303, 307, 308]
              - type: monitor
                title: Cluster
                cache: 1m
                sites:
                  - title: Grafana
                    url: https://grafana.home.mkenkel.com
                    check-url: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api/health
                  - title: Hubble UI
                    url: https://hubble.home.mkenkel.com
                    check-url: http://hubble-ui.kube-system.svc.cluster.local/
                  - title: ntfy
                    url: https://ntfy.home.mkenkel.com
                    check-url: http://ntfy.ntfy.svc.cluster.local/v1/health
                  - title: Headlamp
                    url: https://headlamp.home.mkenkel.com
                    check-url: http://headlamp.headlamp.svc.cluster.local/
                  - title: Gitea
                    url: https://gitea.home.mkenkel.com
                    check-url: http://gitea-app.gitea.svc.cluster.local:3000/api/healthz
              - type: monitor
                title: Infrastructure
                cache: 1m
                sites:
                  - title: TrueNAS
                    url: http://192.168.15.24
                    alt-status-codes: [301, 302, 303, 307, 308]
