# Gitea takes the web UI from the Gateway and Glance's health check, and git over SSH from
# the LAN. It can reach DNS and github.com / api.github.com on 443 (mirrors and imports) and
# nothing else: no other internet host, no other namespace. Webhooks to other hosts stay blocked
# until a rule is added (see runbooks/gitea.md).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gitea-isolation
  namespace: gitea
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Glance's health check.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: glance
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # SSH arrives through the LoadBalancer IP. Depending on which node answers ARP and where the
    # pod runs, the source is seen as the LAN client (world), another node (remote-node) or the
    # node itself (host). The IP is only announced on the LAN.
    - fromEntities:
        - world
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "2222"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          # toFQDNs below only works when Cilium sees the pod's DNS answers, so DNS goes through
          # Cilium's DNS proxy. Every name may be looked up; only the ones below may be connected to.
          rules:
            dns:
              - matchPattern: "*"
    # Pull and push mirrors, and importing a repository. api.github.com is for importing issues
    # and pull requests along with the code; a plain mirror only needs github.com. Release assets
    # (githubusercontent.com hosts) are not allowed.
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
