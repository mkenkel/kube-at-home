# Glance takes traffic from the Gateway only. It can reach DNS, the LAN and internet (Plex and
# TrueNAS checks), and the health ports of the services it checks, and nothing else in the cluster.
# Those services must also admit it: see media-isolation and ntfy-isolation.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: glance-isolation
  namespace: glance
spec:
  endpointSelector: {}
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
      toPorts:
        - ports:
            - port: "5055"
              protocol: TCP
            - port: "7878"
              protocol: TCP
            - port: "8080"
              protocol: TCP
            - port: "8989"
              protocol: TCP
            - port: "9696"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            k8s:app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: hubble-ui
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ntfy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEntities:
        - world
