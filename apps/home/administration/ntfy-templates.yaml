# Turns Alertmanager's webhook JSON into the notification, and sets the priority:
# critical firing = urgent (5), warnings = normal (3), resolved = quiet (2).
# ntfy's built-in `alertmanager` template sets no priority. Used as ?template=cluster.
# ntfy reads the files when it starts, so restart the ntfy pod after editing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-templates
  namespace: ntfy
data:
  cluster.yml: |
    title: |
      {{- if eq .status "firing" }}
      {{ if eq .commonLabels.severity "critical" }}🚨 CRITICAL{{ else }}⚠️ Alert{{ end }}: {{ (first .alerts).labels.alertname }}
      {{- else }}
      ✅ Resolved: {{ (first .alerts).labels.alertname }}
      {{- end }}
    priority: |
      {{- if eq .status "resolved" }}2{{ else if eq .commonLabels.severity "critical" }}5{{ else }}3{{ end }}
    message: |
      {{- range .alerts }}
      {{ .annotations.summary | default .labels.alertname }}
      {{- if .annotations.description }}
      {{ .annotations.description }}
      {{- end }}
      {{ end }}
