apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      prowlarr:
        # The config volume is ReadWriteOnce, so the old pod must stop first.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/prowlarr
              tag: 2.7.0.5723-ls166
            env:
              PUID: "568"
              PGID: "568"
              TZ: America/New_York
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 5
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: 9696
    route:
      app:
        hostnames:
          - prowlarr.home.mkenkel.com
        parentRefs:
          - name: home
            namespace: gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 9696
    persistence:
      config:
        type: persistentVolumeClaim
        # Keep the volume (and the migrated settings) if this release is ever removed.
        retain: true
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /config
