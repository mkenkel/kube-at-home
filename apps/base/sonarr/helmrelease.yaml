apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      sonarr:
        # The config volume is ReadWriteOnce, so the old pod must stop first.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/sonarr
              tag: 4.0.20.3014-ls2
            env:
              PUID: "568"
              PGID: "568"
              TZ: America/New_York
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 5
    service:
      app:
        controller: sonarr
        ports:
          http:
            port: 8989
    route:
      app:
        hostnames:
          - sonarr.home.mkenkel.com
        parentRefs:
          - name: home
            namespace: gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8989
    persistence:
      config:
        type: persistentVolumeClaim
        # Keep the volume (and the migrated settings) if this release is ever removed.
        retain: true
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /config
      media:
        type: persistentVolumeClaim
        existingClaim: media
        globalMounts:
          - path: /media
