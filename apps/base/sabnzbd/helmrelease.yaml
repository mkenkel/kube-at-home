apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: media
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controllers:
      sabnzbd:
        # The config volume is ReadWriteOnce, so the old pod must stop first.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/sabnzbd
              tag: 5.1.3-ls279
            env:
              PUID: "568"
              PGID: "568"
              TZ: America/New_York
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 5
    service:
      app:
        controller: sabnzbd
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - sabnzbd.home.mkenkel.com
        parentRefs:
          - name: home
            namespace: gateway
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8080
    persistence:
      config:
        type: persistentVolumeClaim
        # Keep the volume (and the migrated settings) if this release is ever removed.
        retain: true
        # Include this volume in the Longhorn config backups.
        labels:
          recurring-job.longhorn.io/source: enabled
          recurring-job-group.longhorn.io/config: enabled
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /config
      media:
        type: persistentVolumeClaim
        existingClaim: media
        globalMounts:
          - path: /media
